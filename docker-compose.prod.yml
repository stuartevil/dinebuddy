# Production Docker Compose Configuration for DineBuddy with Supabase Cloud Database

services:
  # 1. FastAPI Backend (Connected to Supabase PostgreSQL Pooler)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinebuddy-backend-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=DineBuddy
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.iahzjepenwomwvjjtszo:HrXbnu%24%24TmqDV4j@aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres}
      - SECRET_KEY=${SECRET_KEY:-dinebuddy-production-secret-key-2026-safe}
      - CORS_ORIGINS=*
      - AWS_REGION=ap-south-1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "
        echo '⏳ Connecting to Supabase cloud database...' &&
        echo '🔄 Verifying database schema with Alembic...' &&
        (alembic upgrade head || true) &&
        echo '🚀 Starting production server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Frontend (Nginx with Gzip Compression)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinebuddy-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads_data:
