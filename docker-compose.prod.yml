# Production Docker Compose Configuration for DineBuddy (Self-Contained Ultra-Fast Stack)
# Co-located PostgreSQL, Redis, FastAPI Backend, and Nginx Frontend on AWS EC2

services:
  # 1. Local PostgreSQL Database (0ms Sub-millisecond latency)
  db:
    image: postgres:15-alpine
    container_name: dinebuddy-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dinebuddy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Redis (For OTP & Caching)
  redis:
    image: redis:7-alpine
    container_name: dinebuddy-redis-prod
    restart: always
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinebuddy-backend-prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=DineBuddy
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/dinebuddy}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - SECRET_KEY=${SECRET_KEY:-dinebuddy-production-secret-key-2026-safe}
      - CORS_ORIGINS=*
      - AWS_REGION=ap-south-1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - uploads_data:/app/uploads
    command: >
      sh -c "
        echo '⏳ Waiting for local database connection...' &&
        sleep 2 &&
        echo '🔄 Verifying database schema with Alembic...' &&
        (alembic upgrade head || true) &&
        echo '🚀 Starting production server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Frontend (Nginx with Gzip Compression)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinebuddy-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uploads_data:
